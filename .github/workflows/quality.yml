name: Validate course site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
                node-version: 24
      - name: Install dependencies (none required)
        run: |
                node --version
      - name: Check static site and course facts
        run: |
                node tests/validate.mjs
                node scripts/check-site.mjs
      - name: Bundle size guard (Study Lab assets)
        env:
                MAX_BUNDLE_BYTES: 700000
        run: |
                node scripts/check-bundle-size.mjs
      - name: Report bundle sizes and upload artifact
        run: |
                node scripts/report-bundle-size.mjs
        # upload bundle-sizes.json for historical tracking
      - name: Upload bundle size artifact
        uses: actions/upload-artifact@v4
        with:
                name: bundle-sizes
                path: bundle-sizes.json
